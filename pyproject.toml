[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "foxyvpn"
version = "1.0.2"
description = "Local SOCKS5 proxy client for the Mozilla VPN / Firefox VPN proxy service."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx[socks]>=0.27",
    "h2>=4.1",
    "cryptography>=42.0",
    "aioquic>=1.0",
]

[project.scripts]
foxyvpn = "foxyvpn.cli:main"

[tool.setuptools]
packages = ["foxyvpn", "foxyvpn.proxy"]
